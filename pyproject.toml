[project]
name = "staff-engineer-from-scratch"
version = "0.1.0"
description = "12-week hands-on path to staff engineer in ML/AI systems: SWE base, RAG, eval, reward models, distributed training, harnesses"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pytest>=8.0",
    "torch>=2.4",        # weeks 8 and 9 (CPU only, gloo backend)
]

# On Linux, install the CPU build of torch (~200 MB) instead of the default CUDA build (~2 GB).
# macOS wheels from PyPI are already CPU/MPS builds, so nothing changes there.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["weeks", "drills"]
